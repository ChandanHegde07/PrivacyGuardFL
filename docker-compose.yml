services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./models:/app/models
    command: ["deploy", "--host", "0.0.0.0", "--port", "5000"]

  train:
    build: .
    profiles: ["train"]
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./models:/app/models
    command: ["train", "--rounds", "10", "--samples", "1000"]

  attack:
    build: .
    profiles: ["attack"]
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    command: ["attack", "--attack-steps", "200"]
