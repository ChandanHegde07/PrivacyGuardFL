[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacuguard-fl"
version = "0.1.0"
description = "Privacy-Preserving Federated Learning with Attack Demonstration & Secure Deployment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
privacyguard = "main:main"

[tool.setuptools]
packages = [
    "src",
    "src.attacks",
    "src.core",
    "src.data",
    "src.deployment",
    "src.differential_privacy",
    "src.ui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::UserWarning"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
